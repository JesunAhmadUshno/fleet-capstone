name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: Learn tests and runner
        run: |
          python tests/test_learn_capstone.py
          python level-1-learn/run_learn.py
      - name: Build tests and runner
        run: |
          python tests/test_build_capstone.py
          python level-2-build/run_build.py
