name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Layout and no-public-grade check
        run: python tests/test_smoke.py
      - name: Learn and Build tests
        run: |
          python tests/test_learn_capstone.py
          python tests/test_build_capstone.py
      - name: Results regenerate from the evidence
        run: |
          python src/run_learn.py
          python src/run_build.py
          git diff --exit-code results/
