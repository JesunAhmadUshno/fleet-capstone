name: Pages

# Builds the live dashboard in site/ from the committed level-1-learn/ and level-2-build/ files and publishes it to GitHub Pages.
# Replaces the legacy branch build of docs/ (a short Jekyll summary page); Pages build_type must be set to workflow.
on:
  push:
    branches: [main]
    paths: ['site/**', 'level-1-learn/**', 'level-2-build/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Parity check (browser port equals the Python results)
        run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
